[project]
name = "textveil"
version = "1.0.1"
description = "文隐 TextVeil — 本地文档信息脱敏工具（Word / Excel / PPT / PDF / Markdown）"
requires-python = ">=3.11,<3.15"
dependencies = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=1.0.0",
    "pymupdf>=1.24.0",
    "lxml>=5.0.0",
    "pywebview>=5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
